<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PandoraIPTV</title>
    <style>
      /* Critical paint — dark canvas before JS/CSS loads (prevents white flash) */
      html, body { background: #0d1511; height: 100%; margin: 0; }
      html[data-theme="light"] body { background: #2c3a33; }
      #root { min-height: 100%; background: #0d1511; }
      /* Critical splash paint — before bundle loads (prevents white flash) */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(820px 520px at 10% -6%, rgba(46, 230, 168, 0.09), transparent 60%),
          radial-gradient(640px 420px at 88% 94%, rgba(46, 230, 168, 0.04), transparent 60%),
          #0d1511;
        overflow: hidden;
        transition: opacity 320ms cubic-bezier(0.2, 0, 0, 1);
      }
      #app-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
        max-width: 360px;
        width: 100%;
        position: relative;
      }
      #app-splash .splash-colorbar {
        display: inline-flex;
        height: 6px;
        width: 72px;
        border-radius: 3px;
        overflow: hidden;
        box-shadow: 0 0 8px rgba(192, 192, 192, 0.22);
      }
      #app-splash .splash-colorbar span { flex: 1; }
      #app-splash .splash-eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2ee6a8;
        font-weight: 600;
      }
      #app-splash .splash-wordmark {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 42px;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: #dce5dd;
      }
      #app-splash .splash-wordmark span { color: #2ee6a8; }
      #app-splash .splash-tagline {
        margin: 0;
        font-family: sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #bacac0;
      }
      #app-splash .splash-tagline strong { color: #dce5dd; }
      #app-splash .splash-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid #3b4a42;
        border-top-color: #2ee6a8;
        border-radius: 50%;
        display: inline-block;
        animation: appSplashSpin 0.82s linear infinite;
        box-shadow: 0 0 16px rgba(46, 230, 168, 0.18);
        margin-top: 10px;
      }
      #app-splash .splash-status {
        margin: 2px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #bacac0;
      }
      #app-splash .splash-foot {
        position: absolute;
        right: 28px;
        bottom: 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
        color: rgba(220, 229, 221, 0.18);
      }
      @keyframes appSplashSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-spinner { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true" role="status" aria-label="Loading PandoraIPTV">
      <div class="splash-inner">
        <div class="splash-colorbar" aria-hidden>
          <span style="background: #c0c0c0"></span>
          <span style="background: #c0c000"></span>
          <span style="background: #00c0c0"></span>
          <span style="background: #00c000"></span>
          <span style="background: #c000c0"></span>
          <span style="background: #c00000"></span>
          <span style="background: #0000c0"></span>
        </div>
        <p class="splash-eyebrow">Signal · Pandora</p>
        <h1 class="splash-wordmark">Pandora<span>IPTV</span></h1>
        <p class="splash-tagline">Premium signal. <strong>Zero static.</strong></p>
        <span class="splash-spinner" aria-hidden="true"></span>
        <p class="splash-status">Tuning signal…</p>
      </div>
      <span class="splash-foot" aria-hidden>CH 00 · SIGNAL · 59.94 Hz</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
